<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cleanova Cleaning Solutions - Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3fc;
            color: #222;
        }


        /* =========================
           LOGIN PAGE
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #4b168c,
                    #7b2cbf,
                    #9d4edd
                );
        }


        .login-card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.2);

            text-align: center;
        }


        .login-logo {
            font-size: 45px;
            margin-bottom: 5px;
        }


        .login-card h1 {
            margin: 0;

            color: #4b168c;

            font-size: 32px;
        }


        .login-card p {
            color: #777;

            margin-bottom: 30px;
        }


        .login-card input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #d4c5e8;

            border-radius: 9px;

            font-size: 16px;

            outline: none;
        }


        .login-card input:focus {
            border-color: #7b2cbf;
        }


        .login-card button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #7b2cbf;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-card button:hover {
            background: #5a189a;
        }


        #loginMessage {
            margin-top: 15px;

            color: #b00020;

            font-size: 14px;
        }


        /* =========================
           ADMIN DASHBOARD
        ========================= */

        #adminPage {
            display: none;
        }


        .header {
            background:
                linear-gradient(
                    135deg,
                    #4b168c,
                    #7b2cbf,
                    #9d4edd
                );

            color: white;

            padding: 30px 20px;

            text-align: center;

            position: relative;
        }


        .header h1 {
            margin: 0;

            font-size: 36px;
        }


        .header p {
            margin: 7px 0 0;

            font-size: 15px;
        }


        .logout-button {
            position: absolute;

            right: 20px;

            top: 25px;

            padding: 10px 16px;

            border: 1px solid rgba(255,255,255,0.7);

            border-radius: 8px;

            background: transparent;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }


        .logout-button:hover {
            background: white;

            color: #5a189a;
        }


        .container {
            max-width: 1200px;

            margin: 35px auto;

            padding: 0 20px;
        }


        .card {
            background: white;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 30px;

            box-shadow:
                0 5px 25px rgba(75, 22, 140, 0.12);
        }


        .card h2 {
            margin-top: 0;

            color: #4b168c;
        }


        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .form-group {
            display: flex;

            flex-direction: column;
        }


        .form-group label {
            margin-bottom: 7px;

            font-weight: bold;

            color: #555;
        }


        .form-group input,
        .form-group select {
            padding: 13px;

            border: 1px solid #d4c5e8;

            border-radius: 8px;

            font-size: 15px;
        }


        .price-display {
            background: #f4edff;

            border: 1px solid #e2d2f7;

            padding: 15px;

            border-radius: 9px;

            font-size: 20px;

            font-weight: bold;

            color: #5a189a;

            margin-top: 20px;

            text-align: center;
        }


        .save-button {
            margin-top: 20px;

            padding: 14px 25px;

            border: none;

            border-radius: 9px;

            background: #7b2cbf;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-button:hover {
            background: #5a189a;
        }


        #saveMessage {
            margin-top: 15px;

            font-weight: bold;
        }


        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }


        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 900px;
        }


        th {
            background: #f4edff;

            color: #4b168c;

            padding: 14px;

            text-align: left;

            border-bottom: 2px solid #e2d2f7;
        }


        td {
            padding: 14px;

            border-bottom: 1px solid #eee;

            vertical-align: middle;
        }


        .status-select {
            padding: 8px;

            border-radius: 7px;

            border: 1px solid #d4c5e8;
        }


        .update-button {
            padding: 8px 12px;

            border: none;

            border-radius: 7px;

            background: #7b2cbf;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }


        .update-button:hover {
            background: #5a189a;
        }


        /* =========================
           QR CODE
        ========================= */

        .qr-container {
            text-align: center;
        }


        .qr-container canvas {
            display: block;

            margin: 0 auto 8px;
        }


        .download-qr {
            padding: 7px 10px;

            border: none;

            border-radius: 7px;

            background: #5a189a;

            color: white;

            cursor: pointer;

            font-size: 12px;

            font-weight: bold;
        }


        .download-qr:hover {
            background: #4b168c;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin: 30px 0;
        }


        .footer strong {
            color: #5a189a;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }


            .header h1 {
                font-size: 29px;
            }


            .logout-button {
                position: static;

                margin-top: 15px;
            }


            .card {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         LOGIN PAGE
    ================================================== -->

    <div id="loginPage">

        <div class="login-card">

            <div class="login-logo">
                ✨
            </div>

            <h1>Cleanova</h1>

            <p>
                Admin Dashboard
            </p>


            <input
                type="email"
                id="loginEmail"
                placeholder="Admin Email"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >


            <button onclick="login()">
                Login
            </button>


            <div id="loginMessage"></div>

        </div>

    </div>



    <!-- ==================================================
         ADMIN PAGE
    ================================================== -->

    <div id="adminPage">


        <!-- HEADER -->

        <div class="header">

            <h1>
                Cleanova Admin Dashboard
            </h1>

            <p>
                Carpet Cleaning Management System
            </p>


            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>



        <div class="container">


            <!-- ==================================================
                 ADD CARPET
            ================================================== -->

            <div class="card">

                <h2>
                    Add New Carpet
                </h2>


                <div class="form-grid">


                    <!-- CARPET ID -->

                    <div class="form-group">

                        <label>
                            Carpet ID
                        </label>

                        <input
                            type="text"
                            id="carpetId"
                            readonly
                        >

                    </div>



                    <!-- LENGTH -->

                    <div class="form-group">

                        <label>
                            Length (ft)
                        </label>

                        <input
                            type="number"
                            id="length"
                            placeholder="e.g. 5"
                            min="0"
                            step="0.01"
                            oninput="calculatePrice()"
                        >

                    </div>



                    <!-- WIDTH -->

                    <div class="form-group">

                        <label>
                            Width (ft)
                        </label>

                        <input
                            type="number"
                            id="width"
                            placeholder="e.g. 7"
                            min="0"
                            step="0.01"
                            oninput="calculatePrice()"
                        >

                    </div>



                    <!-- STATUS -->

                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="status">

                            <option value="Received">
                                Received
                            </option>

                            <option value="Processing">
                                Processing
                            </option>

                            <option value="Ready">
                                Ready
                            </option>

                            <option value="Out for Delivery">
                                Out for Delivery
                            </option>

                            <option value="Delivered">
                                Delivered
                            </option>

                        </select>

                    </div>

                </div>



                <!-- PRICE -->

                <div class="price-display">

                    Price:
                    <span id="price">
                        KSh 0
                    </span>

                </div>



                <button
                    class="save-button"
                    onclick="saveCarpet()"
                >
                    Save Carpet
                </button>


                <div id="saveMessage"></div>

            </div>



            <!-- ==================================================
                 CARPET LIST
            ================================================== -->

            <div class="card">

                <h2>
                    Carpet Orders
                </h2>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    QR Code
                                </th>

                                <th>
                                    Carpet ID
                                </th>

                                <th>
                                    Size
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Current Status
                                </th>

                                <th>
                                    Update Status
                                </th>

                            </tr>

                        </thead>


                        <tbody id="carpetTableBody">

                        </tbody>

                    </table>

                </div>

            </div>



            <!-- FOOTER -->

            <div class="footer">

                <strong>
                    Cleanova Cleaning Solutions
                </strong>

                <br>

                Professional • Reliable • Trusted

                <br><br>

                © 2026 Cleanova Cleaning Solutions

            </div>


        </div>

    </div>



    <!-- ==================================================
         SUPABASE
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ==================================================
         QR CODE LIBRARY
    ================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



    <script>


        /* ==================================================
           SUPABASE CONNECTION
        ================================================== */

        const SUPABASE_URL =
            "https://zrqbawumswnoxfovsyoe.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_diRd3bE2htEeEtGJwnr13w_ZDJaa0VE";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* ==================================================
           GITHUB TRACKING URL
        ================================================== */

        const TRACKING_URL =
            "https://annekairu097-create.github.io/carpet-cleaning-system/track.html?id=";



        /* ==================================================
           LOGIN
        ================================================== */

        async function login() {


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            message.textContent = "";



            if (
                email === "" ||
                password === ""
            ) {

                message.textContent =
                    "Please enter your email and password.";

                return;

            }



            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });



            if (error) {

                console.error(error);

                message.textContent =
                    "❌ Incorrect email or password.";

                return;

            }



            showAdminPage();

        }



        /* ==================================================
           LOGOUT
        ================================================== */

        async function logout() {

            await supabaseClient.auth.signOut();

            document.getElementById(
                "adminPage"
            ).style.display = "none";


            document.getElementById(
                "loginPage"
            ).style.display = "flex";


            document.getElementById(
                "loginPassword"
            ).value = "";

        }



        /* ==================================================
           SHOW ADMIN PAGE
        ================================================== */

        function showAdminPage() {

            document.getElementById(
                "loginPage"
            ).style.display = "none";


            document.getElementById(
                "adminPage"
            ).style.display = "block";


            generateNextCarpetId();

            loadCarpets();

        }



        /* ==================================================
           CHECK EXISTING LOGIN
        ================================================== */

        async function checkLogin() {


            const {
                data
            } =
                await supabaseClient.auth.getSession();


            if (
                data &&
                data.session
            ) {

                showAdminPage();

            }

            else {

                document.getElementById(
                    "loginPage"
                ).style.display = "flex";


                document.getElementById(
                    "adminPage"
                ).style.display = "none";

            }

        }



        /* ==================================================
           GENERATE NEXT CARPET ID
        ================================================== */

        async function generateNextCarpetId() {


            const {
                data,
                error
            } =
                await supabaseClient

                    .from("carpet_orders")

                    .select("carpet_id");


            if (error) {

                console.error(error);

                document.getElementById(
                    "carpetId"
                ).value = "CC-001";

                return;

            }



            let highestNumber = 0;



            if (data) {

                data.forEach(function(row) {


                    const id =
                        row.carpet_id;


                    if (
                        id &&
                        id.startsWith("CC-")
                    ) {

                        const number =
                            parseInt(
                                id.substring(3)
                            );


                        if (
                            !isNaN(number) &&
                            number > highestNumber
                        ) {

                            highestNumber =
                                number;

                        }

                    }

                });

            }



            const nextNumber =
                highestNumber + 1;


            const nextId =
                "CC-" +
                String(nextNumber)
                    .padStart(3, "0");


            document.getElementById(
                "carpetId"
            ).value = nextId;

        }



        /* ==================================================
           CALCULATE PRICE
           KSh 30 PER SQUARE FOOT
        ================================================== */

        function calculatePrice() {


            const length =
                Number(
                    document.getElementById(
                        "length"
                    ).value
                );


            const width =
                Number(
                    document.getElementById(
                        "width"
                    ).value
                );


            const area =
                length * width;


            const price =
                area * 30;


            document.getElementById(
                "price"
            ).textContent =
                "KSh " +
                price.toLocaleString(
                    "en-KE"
                );

        }



        /* ==================================================
           SAVE CARPET
        ================================================== */

        async function saveCarpet() {


            const carpetId =
                document.getElementById(
                    "carpetId"
                ).value;


            const length =
                Number(
                    document.getElementById(
                        "length"
                    ).value
                );


            const width =
                Number(
                    document.getElementById(
                        "width"
                    ).value
                );


            const status =
                document.getElementById(
                    "status"
                ).value;


            const area =
                length * width;


            const price =
                area * 30;


            const message =
                document.getElementById(
                    "saveMessage"
                );


            message.textContent = "";



            if (
                !carpetId ||
                length <= 0 ||
                width <= 0
            ) {

                message.style.color =
                    "#b00020";

                message.textContent =
                    "⚠️ Please enter the carpet length and width.";

                return;

            }



            const {
                data,
                error
            } =
                await supabaseClient

                    .from("carpet_orders")

                    .insert([

                        {

                            carpet_id:
                                carpetId,

                            length:
                                length,

                            width:
                                width,

                            price:
                                price,

                            status:
                                status

                        }

                    ])

                    .select();



            if (error) {

                console.error(error);

                message.style.color =
                    "#b00020";

                message.textContent =
                    "❌ Could not save the carpet.";

                return;

            }



            message.style.color =
                "#16803c";

            message.textContent =
                "✅ Carpet saved successfully!";



            document.getElementById(
                "length"
            ).value = "";


            document.getElementById(
                "width"
            ).value = "";


            document.getElementById(
                "price"
            ).textContent =
                "KSh 0";


            document.getElementById(
                "status"
            ).value =
                "Received";



            await generateNextCarpetId();

            await loadCarpets();

        }



        /* ==================================================
           LOAD CARPETS
        ================================================== */

        async function loadCarpets() {


            const {
                data,
                error
            } =
                await supabaseClient

                    .from("carpet_orders")

                    .select(
                        "carpet_id, length, width, price, status"
                    )

                    .order(
                        "carpet_id",
                        {
                            ascending: true
                        }
                    );



            if (error) {

                console.error(error);

                return;

            }



            const tableBody =
                document.getElementById(
                    "carpetTableBody"
                );


            tableBody.innerHTML = "";



            if (
                !data ||
                data.length === 0
            ) {

                tableBody.innerHTML =

                    '<tr>' +

                    '<td colspan="6" style="text-align:center;">' +

                    'No carpet orders yet.' +

                    '</td>' +

                    '</tr>';

                return;

            }



            data.forEach(function(carpet) {


                const row =
                    document.createElement(
                        "tr"
                    );



                const qrId =
                    "qr-" +
                    carpet.carpet_id
                        .replace(
                            /[^a-zA-Z0-9_-]/g,
                            ""
                        );



                row.innerHTML =

                    '<td>' +

                        '<div class="qr-container">' +

                            '<div id="' +
                            qrId +
                            '"></div>' +

                            '<button ' +

                                'class="download-qr" ' +

                                'onclick="downloadQR(\'' +
                                carpet.carpet_id +
                                '\')"' +

                            '>' +

                                'Download QR' +

                            '</button>' +

                        '</div>' +

                    '</td>' +



                    '<td>' +

                        '<strong>' +

                            carpet.carpet_id +

                        '</strong>' +

                    '</td>' +



                    '<td>' +

                        carpet.length +

                        ' × ' +

                        carpet.width +

                        ' ft' +

                    '</td>' +



                    '<td>' +

                        'KSh ' +

                        Number(
                            carpet.price
                        ).toLocaleString(
                            "en-KE"
                        ) +

                    '</td>' +



                    '<td>' +

                        carpet.status +

                    '</td>' +



                    '<td>' +

                        '<select ' +

                            'class="status-select" ' +

                            'id="status-' +
                            carpet.carpet_id +
                            '"' +

                        '>' +

                            '<option value="Received"' +

                                (
                                    carpet.status ===
                                    "Received"
                                    ? " selected"
                                    : ""
                                ) +

                            '>' +

                                'Received' +

                            '</option>' +



                            '<option value="Processing"' +

                                (
                                    carpet.status ===
                                    "Processing"
                                    ? " selected"
                                    : ""
                                ) +

                            '>' +

                                'Processing' +

                            '</option>' +



                            '<option value="Ready"' +

                                (
                                    carpet.status ===
                                    "Ready"
                                    ? " selected"
                                    : ""
                                ) +

                            '>' +

                                'Ready' +

                            '</option>' +



                            '<option value="Out for Delivery"' +

                                (
                                    carpet.status ===
                                    "Out for Delivery"
                                    ? " selected"
                                    : ""
                                ) +

                            '>' +

                                'Out for Delivery' +

                            '</option>' +



                            '<option value="Delivered"' +

                                (
                                    carpet.status ===
                                    "Delivered"
                                    ? " selected"
                                    : ""
                                ) +

                            '>' +

                                'Delivered' +

                            '</option>' +

                        '</select>' +


                        '<button ' +

                            'class="update-button" ' +

                            'onclick="updateStatus(\'' +
                            carpet.carpet_id +
                            '\')"' +

                        '>' +

                            'Update' +

                        '</button>' +

                    '</td>';



                tableBody.appendChild(
                    row
                );



                /* Generate QR */

                new QRCode(

                    document.getElementById(
                        qrId
                    ),

                    {

                        text:
                            TRACKING_URL +
                            encodeURIComponent(
                                carpet.carpet_id
                            ),

                        width: 140,

                        height: 140

                    }

                );

            });

        }



        /* ==================================================
           UPDATE STATUS
        ================================================== */

        async function updateStatus(
            carpetId
        ) {


            const select =
                document.getElementById(
                    "status-" +
                    carpetId
                );


            const newStatus =
                select.value;



            const {
                error
            } =
                await supabaseClient

                    .from("carpet_orders")

                    .update({

                        status:
                            newStatus

                    })

                    .eq(
                        "carpet_id",
                        carpetId
                    );



            if (error) {

                console.error(error);

                alert(
                    "❌ Could not update status."
                );

                return;

            }



            alert(
                "✅ Status updated successfully."
            );


            await loadCarpets();

        }



        /* ==================================================
           DOWNLOAD QR
        ================================================== */

        function downloadQR(
            carpetId
        ) {


            const qrId =
                "qr-" +
                carpetId.replace(
                    /[^a-zA-Z0-9_-]/g,
                    ""
                );


            const qrContainer =
                document.getElementById(
                    qrId
                );


            if (!qrContainer) {

                alert(
                    "QR code not found."
                );

                return;

            }



            const canvas =
                qrContainer.querySelector(
                    "canvas"
                );


            if (!canvas) {

                alert(
                    "QR code is still loading. Please try again."
                );

                return;

            }



            const image =
                canvas.toDataURL(
                    "image/png"
                );



            const link =
                document.createElement(
                    "a"
                );


            link.href =
                image;


            link.download =
                "Cleanova-" +
                carpetId +
                "-QR.png";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }



        /* ==================================================
           ENTER KEY LOGIN
        ================================================== */

        document
            .getElementById("loginPassword")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        login();

                    }

                }
            );



        /* ==================================================
           START
        ================================================== */

        checkLogin();


    </script>


</body>

</html>
