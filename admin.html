```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleanova Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f3fa;
    color: #222;
}

/* LOGIN */

.login-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    color: #6a1b9a;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
}

button {
    background: #6a1b9a;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #4a126d;
}

.logout {
    width: auto;
    padding: 9px 18px;
    margin: 0;
    background: white;
    color: #6a1b9a;
    border: 1px solid #6a1b9a;
}

.logout:hover {
    background: #f3e5f5;
}

.hidden {
    display: none;
}

/* DASHBOARD */

.header {
    background: #6a1b9a;
    color: white;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header p {
    margin: 5px 0 0;
    opacity: 0.85;
}

.dashboard {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

/* SUMMARY CARDS */

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card-title {
    color: #777;
    font-size: 14px;
    margin-bottom: 8px;
}

.card-number {
    font-size: 30px;
    font-weight: bold;
    color: #6a1b9a;
}

/* ADD CARPET */

.add-section {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.add-section h2 {
    margin-top: 0;
    color: #6a1b9a;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.form-grid input,
.form-grid select {
    margin-bottom: 0;
}

.add-button {
    margin-top: 20px;
    max-width: 200px;
}

/* SEARCH */

.search-box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.search-box input {
    margin: 0;
}

/* TABLE */

.table-container {
    background: white;
    border-radius: 15px;
    padding: 20px;
    overflow-x: auto;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

th {
    background: #f1e7f6;
    color: #4a126d;
    padding: 13px;
    text-align: left;
    font-size: 14px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

tr:hover {
    background: #faf7fc;
}

.status-select {
    width: 150px;
    margin: 0;
}

.update-button {
    width: auto;
    padding: 8px 12px;
    margin: 0;
}

.qr {
    display: flex;
    justify-content: center;
}

.download-button {
    background: #eeeeee;
    color: #333;
    width: auto;
    padding: 7px 10px;
    margin: 0;
}

.download-button:hover {
    background: #ddd;
}

.message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
}

.error {
    background: #ffebee;
    color: #c62828;
}

/* MOBILE */

@media (max-width: 900px) {
    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    .header {
        padding: 18px;
    }

    .header h1 {
        font-size: 20px;
    }

    .dashboard {
        padding: 15px;
    }

    .summary {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .card {
        padding: 16px;
    }

    .card-number {
        font-size: 24px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .add-button {
        max-width: 100%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-container">

    <div class="login-box">

        <div class="logo">Cleanova</div>

        <div class="subtitle">
            Cleaning Solutions — Admin Login
        </div>

        <div id="loginMessage" class="message"></div>

        <label>Email</label>
        <input type="email" id="email" placeholder="Admin email">

        <label>Password</label>
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboardScreen" class="hidden">

    <div class="header">

        <div>
            <h1>Cleanova Admin Dashboard</h1>
            <p>Carpet Cleaning Management System</p>
        </div>

        <button class="logout" onclick="logout()">Logout</button>

    </div>


    <div class="dashboard">

        <!-- SUMMARY -->

        <div class="summary">

            <div class="card">
                <div class="card-title">Total Carpets</div>
                <div class="card-number" id="totalCount">0</div>
            </div>

            <div class="card">
                <div class="card-title">Processing</div>
                <div class="card-number" id="processingCount">0</div>
            </div>

            <div class="card">
                <div class="card-title">Ready</div>
                <div class="card-number" id="readyCount">0</div>
            </div>

            <div class="card">
                <div class="card-title">Delivered</div>
                <div class="card-number" id="deliveredCount">0</div>
            </div>

        </div>


        <!-- ADD CARPET -->

        <div class="add-section">

            <h2>Add New Carpet</h2>

            <div id="addMessage" class="message"></div>

            <div class="form-grid">

                <div>
                    <label>Length (ft)</label>
                    <input type="number" id="length" placeholder="e.g. 6">
                </div>

                <div>
                    <label>Width (ft)</label>
                    <input type="number" id="width" placeholder="e.g. 8">
                </div>

                <div>
                    <label>Expected Ready Date</label>
                    <input type="date" id="expectedDate">
                </div>

                <div>
                    <label>Status</label>
                    <select id="status">
                        <option value="Received">Received</option>
                        <option value="Processing">Processing</option>
                        <option value="Ready">Ready</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                </div>

            </div>

            <button class="add-button" onclick="addCarpet()">
                + Add Carpet
            </button>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="🔍 Search by Carpet ID..."
                onkeyup="filterTable()"
            >

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Carpet ID</th>
                        <th>Length</th>
                        <th>Width</th>
                        <th>Price</th>
                        <th>Expected Ready</th>
                        <th>Last Updated</th>
                        <th>Status</th>
                        <th>Update</th>
                        <th>QR Code</th>
                        <th>Download QR</th>
                    </tr>

                </thead>

                <tbody id="carpetTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://zrqbawumswnoxfovsyoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_diRd3bE2htEeEtGJwnr13w_ZDJaa0VE";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* LOGIN */

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    message.style.display = "none";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        message.className = "message error";
        message.innerText =
            "Login failed: " + error.message;

        message.style.display = "block";

        return;
    }

    showDashboard();

}


/* SHOW DASHBOARD */

function showDashboard() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("dashboardScreen")
        .classList.remove("hidden");

    loadCarpets();

}


/* LOGOUT */

async function logout() {

    await supabaseClient.auth.signOut();

    document
        .getElementById("dashboardScreen")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

}


/* CHECK SESSION */

async function checkSession() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (data.session) {

        showDashboard();

    }

}


/* GENERATE NEXT CARPET ID */

async function generateCarpetID() {

    const { data, error } =
        await supabaseClient
            .from("carpet_orders")
            .select("carpet_id");

    if (error || !data || data.length === 0) {

        return "CC-001";

    }

    let highest = 0;

    data.forEach(item => {

        const match =
            item.carpet_id.match(/CC-(\d+)/);

        if (match) {

            const number =
                parseInt(match[1]);

            if (number > highest) {
                highest = number;
            }

        }

    });

    const next =
        highest + 1;

    return "CC-" +
        String(next).padStart(3, "0");

}


/* ADD CARPET */

async function addCarpet() {

    const length =
        parseFloat(
            document.getElementById("length").value
        );

    const width =
        parseFloat(
            document.getElementById("width").value
        );

    const expectedDate =
        document.getElementById("expectedDate").value;

    const status =
        document.getElementById("status").value;

    const message =
        document.getElementById("addMessage");


    if (!length || !width) {

        message.className =
            "message error";

        message.innerText =
            "Please enter the carpet length and width.";

        message.style.display = "block";

        return;
    }


    const carpetID =
        await generateCarpetID();

    const area =
        length * width;

    const price =
        area * 30;


    const { error } =
        await supabaseClient
            .from("carpet_orders")
            .insert([{

                carpet_id: carpetID,

                length: length,

                width: width,

                price: price,

                expected_ready_date:
                    expectedDate || null,

                status: status,

                updated_at:
                    new Date().toISOString()

            }]);


    if (error) {

        message.className =
            "message error";

        message.innerText =
            "Error: " + error.message;

        message.style.display = "block";

        return;
    }


    message.className =
        "message success";

    message.innerText =
        carpetID +
        " added successfully!";

    message.style.display = "block";


    document.getElementById("length").value = "";
    document.getElementById("width").value = "";
    document.getElementById("expectedDate").value = "";

    loadCarpets();

}


/* LOAD CARPETS */

async function loadCarpets() {

    const { data, error } =
        await supabaseClient
            .from("carpet_orders")
            .select(
                "carpet_id, length, width, price, expected_ready_date, status, updated_at"
            )
            .order("id", { ascending: true });


    if (error) {

        console.error(error);

        return;
    }


    updateSummary(data);

    displayCarpets(data);

}


/* SUMMARY */

function updateSummary(data) {

    document.getElementById("totalCount")
        .innerText = data.length;


    document.getElementById("processingCount")
        .innerText =
        data.filter(
            item => item.status === "Processing"
        ).length;


    document.getElementById("readyCount")
        .innerText =
        data.filter(
            item => item.status === "Ready"
        ).length;


    document.getElementById("deliveredCount")
        .innerText =
        data.filter(
            item => item.status === "Delivered"
        ).length;

}


/* DISPLAY CARPETS */

function displayCarpets(data) {

    const table =
        document.getElementById("carpetTable");

    table.innerHTML = "";


    data.forEach(item => {

        const row =
            document.createElement("tr");


        let expectedDate = "-";

        if (item.expected_ready_date) {

            const date =
                new Date(
                    item.expected_ready_date +
                    "T00:00:00"
                );

            expectedDate =
                date.toLocaleDateString(
                    "en-GB"
                );

        }


        let updatedDate = "-";

        if (item.updated_at) {

            updatedDate =
                new Date(
                    item.updated_at
                ).toLocaleString(
                    "en-GB",
                    {
                        day: "2-digit",
                        month: "short",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }


        row.innerHTML = `

            <td>
                <strong>${item.carpet_id}</strong>
            </td>

            <td>${item.length} ft</td>

            <td>${item.width} ft</td>

            <td>
                KSh ${Number(item.price).toLocaleString()}
            </td>

            <td>${expectedDate}</td>

            <td>${updatedDate}</td>

            <td>

                <select
                    class="status-select"
                    id="status-${item.carpet_id}"
                >

                    <option value="Received"
                        ${item.status === "Received" ? "selected" : ""}>
                        Received
                    </option>

                    <option value="Processing"
                        ${item.status === "Processing" ? "selected" : ""}>
                        Processing
                    </option>

                    <option value="Ready"
                        ${item.status === "Ready" ? "selected" : ""}>
                        Ready
                    </option>

                    <option value="Out for Delivery"
                        ${item.status === "Out for Delivery" ? "selected" : ""}>
                        Out for Delivery
                    </option>

                    <option value="Delivered"
                        ${item.status === "Delivered" ? "selected" : ""}>
                        Delivered
                    </option>

                </select>

            </td>

            <td>

                <button
                    class="update-button"
                    onclick="updateStatus('${item.carpet_id}')"
                >
                    Save
                </button>

            </td>

            <td>

                <div
                    class="qr"
                    id="qr-${item.carpet_id}"
                ></div>

            </td>

            <td>

                <button
                    class="download-button"
                    onclick="downloadQR('${item.carpet_id}')"
                >
                    Download
                </button>

            </td>

        `;


        table.appendChild(row);


        generateQR(item.carpet_id);

    });

}


/* UPDATE STATUS */

async function updateStatus(carpetID) {

    const newStatus =
        document.getElementById(
            "status-" + carpetID
        ).value;


    const { error } =
        await supabaseClient
            .from("carpet_orders")
            .update({

                status: newStatus,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "carpet_id",
                carpetID
            );


    if (error) {

        alert(
            "Error updating status: " +
            error.message
        );

        return;
    }


    loadCarpets();

}


/* QR CODE */

function generateQR(carpetID) {

    const container =
        document.getElementById(
            "qr-" + carpetID
        );

    if (!container) return;

    container.innerHTML = "";


    const trackURL =
        "https://annekairu097-create.github.io/carpet-cleaning-system/track.html?id=" +
        encodeURIComponent(carpetID);


    new QRCode(container, {

        text: trackURL,

        width: 100,

        height: 100

    });

}


/* DOWNLOAD QR */

function downloadQR(carpetID) {

    const container =
        document.getElementById(
            "qr-" + carpetID
        );

    const canvas =
        container.querySelector("canvas");

    if (!canvas) {

        alert("QR code not ready yet.");

        return;
    }


    const link =
        document.createElement("a");

    link.download =
        carpetID + "-QR.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}


/* SEARCH */

function filterTable() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    const rows =
        document.querySelectorAll(
            "#carpetTable tr"
        );


    rows.forEach(row => {

        const text =
            row.innerText.toLowerCase();

        row.style.display =
            text.includes(search)
                ? ""
                : "none";

    });

}


/* START */

checkSession();

</script>

</body>
</html>
```
