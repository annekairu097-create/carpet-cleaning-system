<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cleanova - Track Your Carpet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f7f2fa;
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 550px;
    margin: 40px auto;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    color: #6a1b9a;
    margin-bottom: 5px;
}

.logo p {
    color: #666;
    margin-top: 0;
}

h2 {
    color: #6a1b9a;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    background: #6a1b9a;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #4a126d;
}

.info {
    margin-top: 25px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
    gap: 15px;
}

.label {
    font-weight: bold;
    color: #555;
}

.value {
    text-align: right;
}

.status {
    margin-top: 25px;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
    background: #f1e5f7;
    color: #6a1b9a;
    font-weight: bold;
    font-size: 18px;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.error {
    color: red;
}

.hidden {
    display: none;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    .container {
        margin: 20px auto;
    }

    .card {
        padding: 20px;
    }

    .info-row {
        flex-direction: column;
        gap: 5px;
    }

    .value {
        text-align: left;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">

            <h1>Cleanova</h1>

            <p>Cleaning Solutions</p>

        </div>


        <h2>Track Your Carpet</h2>

        <p>
            Enter your Carpet ID to view your carpet information.
        </p>


        <input
            type="text"
            id="carpetIdInput"
            placeholder="Example: CC-002"
        >


        <button onclick="trackCarpet()">
            Track Carpet
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <div
            id="carpetInfo"
            class="info hidden"
        >

            <div class="info-row">

                <span class="label">
                    Carpet ID
                </span>

                <span
                    class="value"
                    id="displayCarpetId"
                ></span>

            </div>


            <div class="info-row">

                <span class="label">
                    Size
                </span>

                <span
                    class="value"
                    id="displaySize"
                ></span>

            </div>


            <div class="info-row">

                <span class="label">
                    Price
                </span>

                <span
                    class="value"
                    id="displayPrice"
                ></span>

            </div>


            <div class="info-row">

                <span class="label">
                    Expected Ready Date
                </span>

                <span
                    class="value"
                    id="displayReadyDate"
                ></span>

            </div>


            <div
                class="status"
                id="displayStatus"
            ></div>

        </div>


        <div class="footer">

            Cleanova Cleaning Solutions

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://zrqbawumswnoxfovsyoe.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_diRd3bE2htEeEtGJwnr13w_ZDJaa0VE";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   TRACK CARPET
========================= */

async function trackCarpet() {

    const input =
        document.getElementById(
            "carpetIdInput"
        );

    const carpetId =
        input.value.trim().toUpperCase();


    const message =
        document.getElementById(
            "message"
        );

    const carpetInfo =
        document.getElementById(
            "carpetInfo"
        );


    message.textContent = "";

    carpetInfo.classList.add(
        "hidden"
    );


    if (!carpetId) {

        message.textContent =
            "Please enter your Carpet ID.";

        message.className =
            "message error";

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("carpet_orders")
        .select(
            "carpet_id, length, width, price, expected_ready_date, status"
        )
        .ilike(
            "carpet_id",
            carpetId
        )
        .maybeSingle();


    if (error) {

        console.error(error);

        message.textContent =
            "Something went wrong. Please try again.";

        message.className =
            "message error";

        return;
    }


    if (!data) {

        message.textContent =
            "We could not find that Carpet ID.";

        message.className =
            "message error";

        return;
    }


    document.getElementById(
        "displayCarpetId"
    ).textContent =
        data.carpet_id;


    document.getElementById(
        "displaySize"
    ).textContent =
        `${data.length} ft × ${data.width} ft`;


    document.getElementById(
        "displayPrice"
    ).textContent =
        `KSh ${data.price}`;


    let readyDate = "Not yet provided";


    if (data.expected_ready_date) {

        const date =
            new Date(
                data.expected_ready_date +
                "T00:00:00"
            );

        readyDate =
            date.toLocaleDateString(
                "en-GB",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

    }


    document.getElementById(
        "displayReadyDate"
    ).textContent =
        readyDate;


    let customerStatus =
        data.status;


    if (data.status === "Received") {

        customerStatus =
            "🟡 Carpet Received";

    } else if (
        data.status === "Processing"
    ) {

        customerStatus =
            "🔵 Carpet Being Processed";

    } else if (
        data.status === "Ready"
    ) {

        customerStatus =
            "🟢 Ready for Collection";

    } else if (
        data.status === "Out for Delivery"
    ) {

        customerStatus =
            "🚚 Out for Delivery";

    } else if (
        data.status === "Delivered"
    ) {

        customerStatus =
            "✅ Delivered";

    }


    document.getElementById(
        "displayStatus"
    ).textContent =
        customerStatus;


    carpetInfo.classList.remove(
        "hidden"
    );

}


/* =========================
   AUTOMATIC QR TRACKING
========================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const carpetIdFromUrl =
    urlParams.get("id");


if (carpetIdFromUrl) {

    document.getElementById(
        "carpetIdInput"
    ).value =
        carpetIdFromUrl;

    trackCarpet();

}

</script>

</body>
</html>
