```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cleanova Carpet Tracking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f6f3fa;

    color: #222;

}


/* HEADER */

.header {

    background: #6a1b9a;

    color: white;

    text-align: center;

    padding: 28px 20px;

}

.logo {

    font-size: 32px;

    font-weight: bold;

}

.tagline {

    margin-top: 6px;

    opacity: 0.9;

}


/* MAIN */

.container {

    max-width: 650px;

    margin: 35px auto;

    padding: 0 20px;

}


/* SEARCH */

.search-card {

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.07);

    margin-bottom: 25px;

}

.search-card h2 {

    margin-top: 0;

    color: #6a1b9a;

}

.search-card p {

    color: #777;

}


.search-row {

    display: flex;

    gap: 10px;

}

.search-row input {

    flex: 1;

    padding: 14px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 16px;

    text-transform: uppercase;

}

.search-row button {

    padding: 14px 20px;

    border: none;

    border-radius: 9px;

    background: #6a1b9a;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


/* RESULT */

.result {

    display: none;

}


/* STATUS CARD */

.status-card {

    background: white;

    padding: 28px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.07);

    text-align: center;

    margin-bottom: 20px;

}

.status-icon {

    font-size: 48px;

    margin-bottom: 10px;

}

.status-title {

    font-size: 24px;

    font-weight: bold;

    color: #6a1b9a;

}

.status-description {

    color: #666;

    margin-top: 8px;

}


/* DETAILS */

.details {

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:

}

.footer {

}


/* MOBILE */

@media (max-width: 600px) {

    .container {

        margin-top: 20px;

    .search-row {

        flex-direction: column;

    .search-row button {

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="logo">
        Cleanova
    </div>

    <div class="tagline">
        Cleaning Solutions
    </div>

</div>


<div class="container">


    <!-- SEARCH -->

    <div class="search-card">

        <h2>Track Your Carpet</h2>

        <p>
            Enter your Carpet ID to check the status of your carpet.
        </p>


        <div class="search-row">

            <input
                type="text"
                id="carpetID"
                placeholder="Example: CC-001"
            >

            <button onclick="trackCarpet()">
                Track
            </button>

        </div>


        <div id="errorMessage" class="error"></div>

    </div>


    <!-- RESULT -->

    <div id="result" class="result">


        <!-- STATUS -->

        <div class="status-card">

            <div
                id="statusIcon"
                class="status-icon">
            </div>

            <div
                id="statusTitle"
                class="status-title">
            </div>

            <div
                id="statusDescription"
                class="status-description">
            </div>

        </div>


        <!-- DETAILS -->

        <div class="details">

            <h3>Carpet Details</h3>


            <div class="detail-row">

                <span class="detail-label">
                    Carpet ID
                </span>

                <span
                    id="displayID"
                    class="detail-value">
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Size
                </span>

                <span
                    id="displaySize"
                    class="detail-value">
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Price
                </span>

                <span
                    id="displayPrice"
                    class="detail-value">
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Expected Ready Date
                </span>

                <span
                    id="displayDate"
                    class="detail-value">
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Last Updated
                </span>

                <span
                    id="displayUpdated"
                    class="detail-value">
                </span>

            </div>

        </div>

    </div>


</div>


<div class="footer">

    © 2026 Cleanova Cleaning Solutions

</div>


<script>


/* SUPABASE */

const SUPABASE_URL =
"https://zrqbawumswnoxfovsyoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_diRd3bE2htEeEtGJwnr13w_ZDJaa0VE";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* STATUS INFORMATION */

const statusInfo = {

    "Received": {

        icon: "🟡",

        title: "Carpet Received",

        description:
        "Your carpet has been received by Cleanova."

    },

    "Processing": {

        icon: "🔵",

        title: "Carpet Being Processed",

        description:
        "Your carpet is currently being processed."

    },

    "Ready": {

        icon: "🟢",

        title: "Ready for Collection",

        description:
        "Your carpet is ready for collection."

    },

    "Out for Delivery": {

        icon: "🚚",

        title: "Out for Delivery",

        description:
        "Your carpet is currently out for delivery."

    },

    "Delivered": {

        icon: "✅",

        title: "Delivered",

        description:
        "Your carpet has been successfully delivered."

    }

};


/* TRACK CARPET */

async function trackCarpet() {


    const input =
        document
            .getElementById("carpetID")
            .value
            .trim()
            .toUpperCase();


    const error =
        document
            .getElementById("errorMessage");


    const result =
        document
            .getElementById("result");


    error.style.display = "none";

    result.style.display = "none";


    if (!input) {

        error.innerText =
            "Please enter your Carpet ID.";

        error.style.display =
            "block";

        return;

    }


    const { data, error: dbError } =
        await supabaseClient
            .from("carpet_orders")
            .select(
                "carpet_id, length, width, price, expected_ready_date, status, updated_at"
            )
            .eq(
                "carpet_id",
                input
            )
            .maybeSingle();


    if (dbError) {

        error.innerText =
            "Unable to check the carpet status. Please try again.";

        error.style.display =
            "block";

        return;

    }


    if (!data) {

        error.innerText =
            "We could not find that Carpet ID. Please check the ID and try again.";

        error.style.display =
            "block";

        return;

    }


    /* STATUS */

    const status =
        statusInfo[data.status]
        || statusInfo["Received"];


    document
        .getElementById("statusIcon")
        .innerText =
        status.icon;


    document
        .getElementById("statusTitle")
        .innerText =
        status.title;


    document
        .getElementById("statusDescription")
        .innerText =
        status.description;


    /* DETAILS */

    document
        .getElementById("displayID")
        .innerText =
        data.carpet_id;


    document
        .getElementById("displaySize")
        .innerText =
        data.length +
        " ft × " +
        data.width +
        " ft";


    document
        .getElementById("displayPrice")
        .innerText =
        "KSh " +
        Number(data.price)
            .toLocaleString();


    /* EXPECTED DATE */

    let expectedDate = "Not set";

    if (data.expected_ready_date) {

        const date =
            new Date(
                data.expected_ready_date +
                "T00:00:00"
            );

        expectedDate =
            date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

    }


    document
        .getElementById("displayDate")
        .innerText =
        expectedDate;


    /* LAST UPDATED */

    let updated =
        "Not available";


    if (data.updated_at) {

        updated =
            new Date(
                data.updated_at
            ).toLocaleString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    document
        .getElementById("displayUpdated")
        .innerText =
        updated;


    result.style.display =
        "block";

}


/* AUTOMATIC QR TRACKING */

const params =
    new URLSearchParams(
        window.location.search
    );


const qrID =
    params.get("id");


if (qrID) {

    document
        .getElementById("carpetID")
        .value =
        qrID.toUpperCase();

    trackCarpet();

}


/* ENTER KEY */

document
    .getElementById("carpetID")
    .addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                trackCarpet();

            }

        }
    );

</script>


</body>
</html>
